<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="30%" r="92%">
      <stop offset="0%" stop-color="#13202a"/>
      <stop offset="44%" stop-color="#0a141c"/>
      <stop offset="100%" stop-color="#03060a"/>
    </radialGradient>

    <radialGradient id="distantWorld" cx="42%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#9aa9b3"/>
      <stop offset="40%" stop-color="#5d6e79"/>
      <stop offset="74%" stop-color="#2c3a44"/>
      <stop offset="100%" stop-color="#070d12"/>
    </radialGradient>

    <radialGradient id="worldShadow" cx="64%" cy="58%" r="60%">
      <stop offset="0%" stop-color="#03060a" stop-opacity="0"/>
      <stop offset="60%" stop-color="#03060a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#03060a" stop-opacity="0.82"/>
    </radialGradient>

    <linearGradient id="haze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b7d88" stop-opacity="0"/>
      <stop offset="42%" stop-color="#33424d" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#04090e" stop-opacity="0.70"/>
    </linearGradient>

    <linearGradient id="titleFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eef2f5"/>
      <stop offset="42%" stop-color="#c3ced6"/>
      <stop offset="80%" stop-color="#6b7d88"/>
      <stop offset="100%" stop-color="#202b33"/>
    </linearGradient>

    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a5226" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d99a4e"/>
      <stop offset="100%" stop-color="#7a5226" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="flagGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f0b45e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a0f06" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="2.2" numOctaves="3" seed="41"/>
      <feColorMatrix values="0 0 0 0 0.48
                             0 0 0 0 0.52
                             0 0 0 0 0.56
                             0 0 0 0.06 0"/>
    </filter>

    <filter id="titleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="5" result="shadow"/>
      <feFlood flood-color="#020406" flood-opacity="0.95"/>
      <feComposite in2="shadow" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="stars" x="0" y="0" width="240" height="240" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="38" r="0.7" fill="#dde6ec" opacity="0.55"/>
      <circle cx="82" cy="22" r="0.4" fill="#fff" opacity="0.38"/>
      <circle cx="152" cy="78" r="0.85" fill="#cdd7df" opacity="0.46"/>
      <circle cx="202" cy="158" r="0.4" fill="#fff" opacity="0.32"/>
      <circle cx="48" cy="150" r="0.55" fill="#fff" opacity="0.42"/>
      <circle cx="120" cy="182" r="0.45" fill="#cdd7df" opacity="0.36"/>
      <circle cx="34" cy="100" r="0.35" fill="#fff" opacity="0.28"/>
      <circle cx="100" cy="120" r="0.6" fill="#fff" opacity="0.42"/>
      <circle cx="182" cy="48" r="0.35" fill="#fff" opacity="0.28"/>
      <circle cx="222" cy="220" r="0.5" fill="#dde6ec" opacity="0.36"/>
    </pattern>

    <radialGradient id="vignette" cx="50%" cy="50%" r="80%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.74"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1200" fill="url(#spaceBg)"/>
  <rect width="800" height="1200" fill="url(#stars)" opacity="0.5"/>

  <!-- THE FRONTIER WORLD — pale, indifferent, far -->
  <g>
    <circle cx="400" cy="175" r="470" fill="url(#distantWorld)" opacity="0.16"/>
    <circle cx="400" cy="120" r="350" fill="url(#distantWorld)"/>
    <!-- dust banding -->
    <ellipse cx="400" cy="70" rx="338" ry="9" fill="#aeb9c1" opacity="0.20"/>
    <ellipse cx="400" cy="120" rx="346" ry="7" fill="#28333b" opacity="0.34"/>
    <ellipse cx="400" cy="178" rx="330" ry="11" fill="#bcc6cd" opacity="0.15"/>
    <ellipse cx="400" cy="238" rx="300" ry="8" fill="#1d262d" opacity="0.40"/>
    <ellipse cx="400" cy="300" rx="262" ry="9" fill="#b3bdc4" opacity="0.12"/>
    <!-- terminator -->
    <circle cx="400" cy="120" r="350" fill="url(#worldShadow)"/>
  </g>

  <!-- cold drift of haze -->
  <g opacity="0.4" filter="url(#soft)">
    <path d="M -50 300 Q 250 250 470 320 T 850 300 L 850 460 Q 500 400 230 470 T -50 440 Z" fill="#3a4a55" opacity="0.5"/>
  </g>

  <rect x="0" y="470" width="800" height="730" fill="url(#haze)"/>

  <!-- SCUPPER — the free port adrift in the grey zone -->
  <g>
    <!-- the long dark hull of the port, hung in the dark -->
    <g fill="#0b141a">
      <rect x="150" y="690" width="500" height="40" rx="6"/>
      <rect x="120" y="704" width="560" height="14" rx="4" opacity="0.9"/>
      <!-- spars / docking arms -->
      <rect x="232" y="640" width="14" height="58"/>
      <rect x="400" y="628" width="16" height="70"/>
      <rect x="560" y="648" width="13" height="52"/>
      <rect x="300" y="728" width="12" height="60"/>
      <rect x="470" y="728" width="12" height="66"/>
      <!-- a docked hull or two -->
      <path d="M 196 636 L 250 632 L 262 648 L 208 652 Z"/>
      <path d="M 540 632 L 600 636 L 596 654 L 536 650 Z"/>
    </g>
    <!-- thin steel edge-light catching the far sun -->
    <rect x="150" y="690" width="500" height="2.4" fill="#7d8d97" opacity="0.55"/>
    <rect x="400" y="628" width="16" height="2" fill="#7d8d97" opacity="0.5"/>

    <!-- cold window-lights — pale, scattered, ordinary -->
    <g fill="#aebfc8">
      <rect x="210" y="702" width="2.4" height="4" opacity="0.7"/>
      <rect x="246" y="704" width="2.4" height="4" opacity="0.5"/>
      <rect x="300" y="701" width="2.4" height="4" opacity="0.65"/>
      <rect x="356" y="705" width="2.4" height="4" opacity="0.45"/>
      <rect x="430" y="702" width="2.4" height="4" opacity="0.6"/>
      <rect x="486" y="704" width="2.4" height="4" opacity="0.5"/>
      <rect x="540" y="701" width="2.4" height="4" opacity="0.6"/>
      <rect x="588" y="705" width="2.4" height="4" opacity="0.4"/>
    </g>

    <!-- THE QUIET FLAG — a single amber marker-light, the one that gives them away -->
    <circle cx="416" cy="616" r="42" fill="url(#flagGlow)"/>
    <circle cx="416" cy="616" r="3" fill="#ffce8a" opacity="0.95"/>
    <circle cx="416" cy="616" r="7.5" fill="#f0a64a" opacity="0.35"/>
  </g>

  <!-- bleak frontier floor far below -->
  <path d="M 0 980 L 120 968 L 240 978 L 360 966 L 480 978 L 600 966 L 720 978 L 800 970 L 800 1200 L 0 1200 Z" fill="#070d12"/>
  <path d="M 0 1040 L 800 1028 L 800 1200 L 0 1200 Z" fill="#03070a"/>

  <!-- TYPOGRAPHY -->
  <g transform="translate(400, 92)">
    <line x1="-200" y1="0" x2="-65" y2="0" stroke="#070d12" stroke-width="0.8"/>
    <line x1="65" y1="0" x2="200" y2="0" stroke="#070d12" stroke-width="0.8"/>
    <g fill="#070d12">
      <path d="M -55 0 L -50 -4 L -45 0 L -50 4 Z"/>
      <path d="M 55 0 L 50 -4 L 45 0 L 50 4 Z"/>
    </g>
    <text x="0" y="5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="11" font-style="italic" letter-spacing="7" fill="#070d12">A NOVEL OF THE OUTER HEGEMONY</text>
  </g>

  <text x="400" y="150" text-anchor="middle" font-family="Georgia, serif"
        font-size="17" letter-spacing="16" fill="#070d12" font-weight="300">EXILE</text>

  <!-- MAIN TITLE -->
  <g transform="translate(400, 1000)" filter="url(#titleShadow)">
    <text x="0" y="-95" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="30" letter-spacing="22" fill="#8c9aa3" font-style="italic" font-weight="300">THE</text>
    <text x="0" y="-30" text-anchor="middle" font-family="'Trajan Pro', 'Cinzel', Georgia, serif"
          font-size="98" letter-spacing="10" fill="url(#titleFill)" font-weight="900">QUIET</text>
    <text x="0" y="62" text-anchor="middle" font-family="'Trajan Pro', 'Cinzel', Georgia, serif"
          font-size="98" letter-spacing="16" fill="url(#titleFill)" font-weight="900">FLAG</text>
  </g>

  <g transform="translate(400, 1095)">
    <line x1="-180" y1="0" x2="180" y2="0" stroke="url(#amberAccent)" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="3" fill="#d99a4e"/>
    <circle cx="-30" cy="0" r="1.5" fill="#6b7d88" opacity="0.8"/>
    <circle cx="30" cy="0" r="1.5" fill="#6b7d88" opacity="0.8"/>
  </g>

  <text x="400" y="1138" text-anchor="middle" font-family="Georgia, serif"
        font-size="10" letter-spacing="9" fill="#7d8d97" font-style="italic">BOOK TWO OF THE TARTAROS CYCLE</text>
  <text x="400" y="1166" text-anchor="middle" font-family="Georgia, serif"
        font-size="9" letter-spacing="5" fill="#5a6a74" opacity="0.9">WHAT THE SILENCE KEEPS</text>

  <rect width="800" height="1200" filter="url(#grain)" opacity="0.5"/>
  <rect width="800" height="1200" fill="url(#vignette)"/>
</svg>
