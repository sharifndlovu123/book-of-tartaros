<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Same base palette as front cover for consistency -->
    <radialGradient id="spaceBg" cx="50%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#1a0606"/>
      <stop offset="50%" stop-color="#0e0303"/>
      <stop offset="100%" stop-color="#020101"/>
    </radialGradient>

    <!-- Subtle horizon glow -->
    <linearGradient id="horizonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a0a04" stop-opacity="0"/>
      <stop offset="60%" stop-color="#5a1208" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a0202" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Faint distant Moloch on the back -->
    <radialGradient id="distantMoloch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5a1810" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#2a0808" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0202" stop-opacity="0"/>
    </radialGradient>

    <!-- Blood accent -->
    <linearGradient id="bloodAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a0a04" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c43018"/>
      <stop offset="100%" stop-color="#5a0a04" stop-opacity="0"/>
    </linearGradient>

    <!-- Title fill for the small back-cover title -->
    <linearGradient id="titleFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8e8d0"/>
      <stop offset="50%" stop-color="#c4a880"/>
      <stop offset="100%" stop-color="#7a4a2a"/>
    </linearGradient>

    <!-- Grain -->
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="2.2" numOctaves="3" seed="23"/>
      <feColorMatrix values="0 0 0 0 0.5
                             0 0 0 0 0.18
                             0 0 0 0 0.08
                             0 0 0 0.07 0"/>
    </filter>

    <!-- Stars -->
    <pattern id="stars" x="0" y="0" width="240" height="240" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="40" r="0.6" fill="#fff" opacity="0.45"/>
      <circle cx="80" cy="20" r="0.4" fill="#fff" opacity="0.35"/>
      <circle cx="150" cy="80" r="0.7" fill="#fff" opacity="0.4"/>
      <circle cx="200" cy="160" r="0.4" fill="#fff" opacity="0.3"/>
      <circle cx="50" cy="150" r="0.5" fill="#fff" opacity="0.4"/>
      <circle cx="120" cy="180" r="0.4" fill="#fff" opacity="0.3"/>
      <circle cx="35" cy="100" r="0.3" fill="#fff" opacity="0.25"/>
      <circle cx="180" cy="50" r="0.35" fill="#fff" opacity="0.3"/>
      <circle cx="220" cy="220" r="0.45" fill="#fff" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#spaceBg)"/>
  <rect width="800" height="1200" fill="url(#stars)" opacity="0.4"/>

  <!-- Faint distant Moloch presence in upper right corner — back of the planet, barely there -->
  <circle cx="700" cy="100" r="280" fill="url(#distantMoloch)" opacity="0.6"/>
  <circle cx="700" cy="100" r="180" fill="#3a0a08" opacity="0.4"/>
  <circle cx="700" cy="100" r="120" fill="#4a1208" opacity="0.3"/>

  <!-- Horizon glow at bottom -->
  <rect x="0" y="900" width="800" height="300" fill="url(#horizonGlow)"/>

  <!-- Top decorative ornament -->
  <g transform="translate(400, 90)">
    <line x1="-180" y1="0" x2="-50" y2="0" stroke="#7a3520" stroke-width="0.6"/>
    <line x1="50" y1="0" x2="180" y2="0" stroke="#7a3520" stroke-width="0.6"/>
    <g fill="#9a4528">
      <path d="M -42 0 L -37 -4 L -32 0 L -37 4 Z"/>
      <path d="M 42 0 L 37 -4 L 32 0 L 37 4 Z"/>
    </g>
    <text x="0" y="5" text-anchor="middle"
          font-family="Georgia, serif"
          font-size="10" font-style="italic" letter-spacing="6"
          fill="#a87858">SCIENCE FICTION • THRILLER</text>
  </g>

  <!-- ============ PULL QUOTE ============ -->
  <g transform="translate(400, 200)">
    <text x="0" y="0" text-anchor="middle"
          font-family="Georgia, serif"
          font-size="28" font-style="italic"
          fill="#e0c098" font-weight="300">
      <tspan x="0" dy="0">&#8220;Run, Kester.&#8221;</tspan>
    </text>
    <text x="0" y="42" text-anchor="middle"
          font-family="Georgia, serif"
          font-size="20" font-style="italic"
          fill="#a87858" font-weight="300">
      <tspan x="0" dy="0">&#8220;You were going to kill me either way.&#8221;</tspan>
    </text>
    <text x="0" y="74" text-anchor="middle"
          font-family="Georgia, serif"
          font-size="18" font-style="italic"
          fill="#7a4a2a" font-weight="300">
      <tspan x="0" dy="0">&#8220;Well. Yes.&#8221;</tspan>
    </text>
  </g>

  <!-- Decorative divider -->
  <g transform="translate(400, 320)">
    <line x1="-100" y1="0" x2="-15" y2="0" stroke="url(#bloodAccent)" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="2.5" fill="#c43018"/>
    <line x1="15" y1="0" x2="100" y2="0" stroke="url(#bloodAccent)" stroke-width="0.8"/>
  </g>

  <!-- ============ BLURB ============ -->
  <g transform="translate(400, 380)" font-family="Georgia, 'Times New Roman', serif" fill="#d4b890">
    
    <!-- Paragraph 1 - Setup -->
    <text x="0" y="0" text-anchor="middle" font-size="16">
      <tspan x="0" dy="0">For nine years, Kester Vaile signed the paperwork.</tspan>
      <tspan x="0" dy="26">Requisitions. Personnel transfers. Quarterly reports for a wing</tspan>
      <tspan x="0" dy="26">of his prison whose patients never came back. He filed every</tspan>
      <tspan x="0" dy="26">document carefully. He never read them.</tspan>
    </text>

    <!-- Paragraph 2 - Inciting -->
    <text x="0" y="160" text-anchor="middle" font-size="16">
      <tspan x="0" dy="0">When a Federation inspector asks him a single question,</tspan>
      <tspan x="0" dy="26">Kester begins to read. What he finds breaks his career,</tspan>
      <tspan x="0" dy="26">his life, and his quiet eleven-year accommodation with the</tspan>
      <tspan x="0" dy="26">man who has been his mentor: Warden Bastien Orrel.</tspan>
    </text>

    <!-- Paragraph 3 - Stakes & escalation -->
    <text x="0" y="320" text-anchor="middle" font-size="16">
      <tspan x="0" dy="0">But the prison is older than Kester knows.</tspan>
      <tspan x="0" dy="26">The Warden is not the apex.</tspan>
      <tspan x="0" dy="26">And the cohort the prison has been quietly cultivating</tspan>
      <tspan x="0" dy="26">for twenty-two years is finally ready for the harvest.</tspan>
    </text>

  </g>

  <!-- Decorative divider -->
  <g transform="translate(400, 850)">
    <line x1="-180" y1="0" x2="-15" y2="0" stroke="url(#bloodAccent)" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="3" fill="#c43018"/>
    <line x1="15" y1="0" x2="180" y2="0" stroke="url(#bloodAccent)" stroke-width="0.8"/>
  </g>

  <!-- ============ DREAD LINE ============ -->
  <g transform="translate(400, 920)">
    <text x="0" y="0" text-anchor="middle"
          font-family="Georgia, serif"
          font-size="20" font-style="italic"
          fill="#e0c098">
      <tspan x="0" dy="0">A prison moon. A vanished planet.</tspan>
      <tspan x="0" dy="32">An empire built on bodies the world has stopped counting.</tspan>
    </text>
  </g>

  <!-- ============ FOOTER ============ -->
  
  <!-- Small title rendition -->
  <g transform="translate(400, 1050)">
    <text x="0" y="0" text-anchor="middle"
          font-family="'Trajan Pro', 'Cinzel', Georgia, serif"
          font-size="22" letter-spacing="6"
          fill="url(#titleFill)" font-weight="900">THE WARDEN of TARTAROS</text>
  </g>

  <!-- Author -->
  <text x="400" y="1090" text-anchor="middle"
        font-family="Georgia, serif"
        font-size="13" letter-spacing="9"
        fill="#a87858" font-style="italic">A NOVEL BY KESTER VAILE</text>

  <!-- Series mark -->
  <text x="400" y="1135" text-anchor="middle"
        font-family="Georgia, serif"
        font-size="10" letter-spacing="8"
        fill="#7a4a2a" font-style="italic">BOOK ONE OF THE TARTAROS CYCLE</text>

  <!-- Final dread tag -->
  <text x="400" y="1170" text-anchor="middle"
        font-family="Georgia, serif"
        font-size="9" letter-spacing="5"
        fill="#5a2a18" opacity="0.85">EVERYONE HAS A PART TO PLAY</text>

  <!-- Grain overlay -->
  <rect width="800" height="1200" filter="url(#grain)" opacity="0.5"/>

  <!-- Vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="80%">
    <stop offset="55%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
  </radialGradient>
  <rect width="800" height="1200" fill="url(#vignette)"/>
</svg>
