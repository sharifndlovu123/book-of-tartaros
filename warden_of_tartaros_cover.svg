<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="40%" stop-color="#150404"/>
      <stop offset="100%" stop-color="#020101"/>
    </radialGradient>

    <radialGradient id="molochBody" cx="38%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#d04828"/>
      <stop offset="35%" stop-color="#9a2010"/>
      <stop offset="75%" stop-color="#3a0808"/>
      <stop offset="100%" stop-color="#0a0202"/>
    </radialGradient>

    <radialGradient id="molochEye" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffaa6a"/>
      <stop offset="20%" stop-color="#ff6a30"/>
      <stop offset="55%" stop-color="#a82010"/>
      <stop offset="100%" stop-color="#1a0202" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="eyeIris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe4b8"/>
      <stop offset="35%" stop-color="#ff8a48"/>
      <stop offset="80%" stop-color="#a02810"/>
      <stop offset="100%" stop-color="#3a0808"/>
    </radialGradient>

    <linearGradient id="haze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5a28" stop-opacity="0"/>
      <stop offset="40%" stop-color="#c4321a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a0404" stop-opacity="0.65"/>
    </linearGradient>

    <linearGradient id="titleFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8e8d0"/>
      <stop offset="40%" stop-color="#d4b48c"/>
      <stop offset="80%" stop-color="#8a5a38"/>
      <stop offset="100%" stop-color="#4a2810"/>
    </linearGradient>

    <linearGradient id="bloodAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a0a04" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c43018"/>
      <stop offset="100%" stop-color="#5a0a04" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="undergroundGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3a1a08" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a0202" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="2.2" numOctaves="3" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.5
                             0 0 0 0 0.18
                             0 0 0 0 0.08
                             0 0 0 0.07 0"/>
    </filter>

    <filter id="titleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="5" result="shadow"/>
      <feFlood flood-color="#0a0101" flood-opacity="0.95"/>
      <feComposite in2="shadow" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="stars" x="0" y="0" width="240" height="240" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="40" r="0.7" fill="#fff" opacity="0.65"/>
      <circle cx="80" cy="20" r="0.4" fill="#fff" opacity="0.45"/>
      <circle cx="150" cy="80" r="0.9" fill="#fff" opacity="0.55"/>
      <circle cx="200" cy="160" r="0.4" fill="#fff" opacity="0.4"/>
      <circle cx="50" cy="150" r="0.55" fill="#fff" opacity="0.5"/>
      <circle cx="120" cy="180" r="0.45" fill="#fff" opacity="0.4"/>
      <circle cx="35" cy="100" r="0.35" fill="#fff" opacity="0.3"/>
      <circle cx="100" cy="120" r="0.6" fill="#fff" opacity="0.5"/>
      <circle cx="180" cy="50" r="0.35" fill="#fff" opacity="0.35"/>
      <circle cx="220" cy="220" r="0.5" fill="#fff" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="800" height="1200" fill="url(#spaceBg)"/>
  <rect width="800" height="1200" fill="url(#stars)" opacity="0.55"/>

  <!-- MOLOCH -->
  <g>
    <circle cx="400" cy="180" r="540" fill="url(#molochEye)" opacity="0.32"/>
    <circle cx="400" cy="120" r="395" fill="url(#molochBody)"/>
    <ellipse cx="400" cy="60" rx="385" ry="12" fill="#1a0404" opacity="0.55"/>
    <ellipse cx="400" cy="110" rx="392" ry="9" fill="#5a1208" opacity="0.4"/>
    <ellipse cx="400" cy="160" rx="385" ry="14" fill="#1a0404" opacity="0.5"/>
    <ellipse cx="400" cy="220" rx="370" ry="10" fill="#3a0808" opacity="0.45"/>
    <ellipse cx="400" cy="270" rx="355" ry="14" fill="#1a0202" opacity="0.55"/>
    <ellipse cx="400" cy="320" rx="335" ry="9" fill="#3a0808" opacity="0.4"/>
    <ellipse cx="400" cy="370" rx="305" ry="12" fill="#1a0202" opacity="0.5"/>
    <ellipse cx="400" cy="420" rx="265" ry="8" fill="#3a0808" opacity="0.4"/>

    <!-- The Eye - large, central, watching -->
    <ellipse cx="380" cy="180" rx="120" ry="58" fill="#1a0202" opacity="0.5"/>
    <ellipse cx="380" cy="180" rx="92" ry="42" fill="url(#eyeIris)"/>
    <ellipse cx="380" cy="180" rx="55" ry="22" fill="#ffaa68"/>
    <ellipse cx="380" cy="180" rx="22" ry="9" fill="#fff0d8"/>
    <ellipse cx="380" cy="180" rx="6" ry="3" fill="#1a0404"/>
  </g>

  <rect x="0" y="500" width="800" height="700" fill="url(#haze)"/>

  <!-- MOON SURFACE -->
  <path d="M 0 700 Q 200 685 400 695 T 800 700 L 800 1200 L 0 1200 Z" fill="#2a0a06"/>
  <path d="M 0 770 L 90 760 L 160 778 L 240 768 L 340 782 L 430 770 L 540 786 L 640 772 L 740 788 L 800 780 L 800 1200 L 0 1200 Z" fill="#180504" opacity="0.95"/>

  <!-- FACILITY NINE -->
  <g>
    <rect x="0" y="850" width="800" height="60" fill="#080202"/>
    
    <g fill="#0a0202">
      <rect x="40" y="800" width="22" height="60"/>
      <rect x="80" y="780" width="28" height="80"/>
      <rect x="135" y="810" width="20" height="50"/>
      <rect x="175" y="790" width="25" height="70"/>
      <rect x="220" y="800" width="22" height="60"/>
    </g>
    <g fill="#ff5a28">
      <rect x="48" y="820" width="3" height="5" opacity="0.7"/>
      <rect x="92" y="800" width="3" height="5" opacity="0.85"/>
      <rect x="92" y="820" width="3" height="5" opacity="0.6"/>
      <rect x="183" y="810" width="3" height="5" opacity="0.75"/>
      <rect x="227" y="820" width="3" height="5" opacity="0.7"/>
    </g>

    <!-- Citadel -->
    <g>
      <rect x="320" y="660" width="160" height="270" fill="#040101"/>
      <rect x="316" y="655" width="168" height="8" fill="#5a1208"/>
      <rect x="310" y="648" width="180" height="10" fill="#080202"/>
      <line x1="400" y1="648" x2="400" y2="555" stroke="#0a0202" stroke-width="4"/>
      <line x1="394" y1="585" x2="406" y2="585" stroke="#3a0808" stroke-width="2"/>
      <line x1="392" y1="610" x2="408" y2="610" stroke="#3a0808" stroke-width="2"/>
      <line x1="388" y1="630" x2="412" y2="630" stroke="#3a0808" stroke-width="2"/>
      <circle cx="400" cy="552" r="4" fill="#ff3a18"/>
      <circle cx="400" cy="552" r="6" fill="#ff3a18" opacity="0.4"/>
      <circle cx="400" cy="552" r="9" fill="#ff3a18" opacity="0.15"/>
      
      <g fill="#ff5a28">
        <rect x="338" y="700" width="5" height="9"/>
        <rect x="358" y="700" width="5" height="9" opacity="0.85"/>
        <rect x="378" y="700" width="5" height="9"/>
        <rect x="398" y="700" width="5" height="9" opacity="0.9"/>
        <rect x="418" y="700" width="5" height="9"/>
        <rect x="438" y="700" width="5" height="9" opacity="0.85"/>
        <rect x="458" y="700" width="5" height="9"/>
        
        <rect x="348" y="740" width="5" height="9" opacity="0.7"/>
        <rect x="378" y="740" width="5" height="9" opacity="0.9"/>
        <rect x="408" y="740" width="5" height="9" opacity="0.7"/>
        <rect x="448" y="740" width="5" height="9" opacity="0.6"/>
        
        <rect x="358" y="780" width="5" height="9" opacity="0.55"/>
        <rect x="398" y="780" width="5" height="9" opacity="0.8"/>
        <rect x="438" y="780" width="5" height="9" opacity="0.5"/>
        
        <rect x="378" y="820" width="5" height="9" opacity="0.4"/>
        <rect x="418" y="820" width="5" height="9" opacity="0.65"/>
      </g>
      
      <path d="M 400 670 L 220 920 L 270 920 Z" fill="#ff5a28" opacity="0.06"/>
      <path d="M 400 670 L 580 920 L 530 920 Z" fill="#ff5a28" opacity="0.06"/>
    </g>

    <g fill="#0a0202">
      <rect x="555" y="800" width="22" height="60"/>
      <rect x="600" y="785" width="26" height="75"/>
      <rect x="650" y="810" width="20" height="50"/>
      <rect x="690" y="790" width="24" height="70"/>
      <rect x="740" y="805" width="22" height="55"/>
    </g>
    <g fill="#ff5a28">
      <rect x="563" y="820" width="3" height="5" opacity="0.7"/>
      <rect x="610" y="800" width="3" height="5" opacity="0.85"/>
      <rect x="610" y="820" width="3" height="5" opacity="0.55"/>
      <rect x="700" y="810" width="3" height="5" opacity="0.75"/>
      <rect x="748" y="820" width="3" height="5" opacity="0.6"/>
    </g>

    <path d="M 0 920 L 80 905 L 160 915 L 240 900 L 320 912 L 400 898 L 480 910 L 560 895 L 640 908 L 720 893 L 800 906 L 800 1200 L 0 1200 Z" fill="#020101"/>
  </g>

  <!-- LAYERS BENEATH - the palace, the chamber -->
  <g opacity="0.55">
    <ellipse cx="400" cy="1080" rx="280" ry="60" fill="url(#undergroundGlow)"/>
    
    <g stroke="#2a0a06" stroke-width="0.5" fill="none" opacity="0.6">
      <line x1="280" y1="1000" x2="520" y2="1000"/>
      <line x1="240" y1="1040" x2="560" y2="1040"/>
      <line x1="200" y1="1080" x2="600" y2="1080"/>
      <line x1="320" y1="990" x2="320" y2="1100"/>
      <line x1="400" y1="985" x2="400" y2="1110"/>
      <line x1="480" y1="990" x2="480" y2="1100"/>
    </g>
    
    <circle cx="400" cy="1075" r="3" fill="#c4582a" opacity="0.6"/>
    <circle cx="400" cy="1075" r="8" fill="#c4582a" opacity="0.2"/>
  </g>

  <!-- TYPOGRAPHY -->
  
  <g transform="translate(400, 90)">
    <line x1="-200" y1="0" x2="-65" y2="0" stroke="#7a3520" stroke-width="0.6"/>
    <line x1="65" y1="0" x2="200" y2="0" stroke="#7a3520" stroke-width="0.6"/>
    <g fill="#9a4528">
      <path d="M -55 0 L -50 -4 L -45 0 L -50 4 Z"/>
      <path d="M 55 0 L 50 -4 L 45 0 L 50 4 Z"/>
    </g>
    <text x="0" y="5" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="11" font-style="italic" letter-spacing="7"
          fill="#c89878">A NOVEL OF THE OUTER HEGEMONY</text>
  </g>

  <text x="400" y="148" text-anchor="middle"
        font-family="Georgia, serif"
        font-size="17" letter-spacing="16"
        fill="#e0c098" font-weight="300">KESTER VAILE</text>

  <!-- MAIN TITLE -->
  <g transform="translate(400, 1000)" filter="url(#titleShadow)">
    <text x="0" y="-95" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="30" letter-spacing="22"
          fill="#b89878" font-style="italic" font-weight="300">THE</text>

    <text x="0" y="-32" text-anchor="middle"
          font-family="'Trajan Pro', 'Cinzel', Georgia, serif"
          font-size="96" letter-spacing="8"
          fill="url(#titleFill)" font-weight="900">WARDEN</text>

    <text x="0" y="22" text-anchor="middle"
          font-family="Georgia, serif"
          font-size="24" letter-spacing="10"
          fill="#9a6848" font-style="italic">of</text>

    <text x="0" y="86" text-anchor="middle"
          font-family="'Trajan Pro', 'Cinzel', Georgia, serif"
          font-size="86" letter-spacing="16"
          fill="url(#titleFill)" font-weight="900">TARTAROS</text>
  </g>

  <g transform="translate(400, 1115)">
    <line x1="-180" y1="0" x2="180" y2="0" stroke="url(#bloodAccent)" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="3" fill="#c43018"/>
    <circle cx="-30" cy="0" r="1.5" fill="#7a1a08" opacity="0.7"/>
    <circle cx="30" cy="0" r="1.5" fill="#7a1a08" opacity="0.7"/>
  </g>

  <text x="400" y="1155" text-anchor="middle"
        font-family="Georgia, serif"
        font-size="10" letter-spacing="9"
        fill="#7a4a2a" font-style="italic">BOOK ONE OF THE TARTAROS CYCLE</text>

  <text x="400" y="1180" text-anchor="middle"
        font-family="Georgia, serif"
        font-size="9" letter-spacing="5"
        fill="#5a2a18" opacity="0.85">EVERYONE HAS A PART TO PLAY</text>

  <rect width="800" height="1200" filter="url(#grain)" opacity="0.55"/>

  <radialGradient id="vignette" cx="50%" cy="50%" r="80%">
    <stop offset="55%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.7"/>
  </radialGradient>
  <rect width="800" height="1200" fill="url(#vignette)"/>
</svg>
